# Nextest profiles for the gate. `gate/nextest.toml` is the original and `.config/nextest.toml`
# its copy, which is where nextest looks; `cargo xtask lints` keeps the two identical.
# Reports are written to `target/nextest/<profile>/junit.xml`.

[profile.default]
retries = 0
fail-fast = false
junit.path = "junit.xml"

[profile.ci]
retries = 0
fail-fast = false
junit.path = "junit.xml"
