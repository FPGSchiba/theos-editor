[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# Not used by the library yet (`engine-free` will use it). It is a normal dependency, not a
# dev-dependency, so that `cargo run -p xtask` and `cargo test --workspace` resolve the same
# features for `serde_json` and `serde_core`. Otherwise the second build relinks
# `target/debug/xtask.exe`, which Windows refuses while `cargo xtask test` is running it.
cargo_metadata.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
