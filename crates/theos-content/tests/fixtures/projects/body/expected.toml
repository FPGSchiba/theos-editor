# body/link-unclosed (section 5.3, every kind): `[[a here.` never closes; the finding sits at the
# `[[` after "Synthetic text with an unclosed ". The attribute line that a blank line separates
# from `## Beat 2` above it means nothing in a topic, which has no beats: no misplaced-attributes.
[[finding]]
path = "lore/topics/synthetic-board-explaining.md"
rule = "body/link-unclosed"
severity = "error"
line = 30
column = 33

