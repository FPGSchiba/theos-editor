severity = "error"
line = 9
column = 32

[[finding]]
path = "lore/topics/synthetic-board-explaining.md"
rule = "body/embed"
severity = "error"
line = 9
column = 44

[[finding]]
path = "lore/topics/synthetic-board-explaining.md"
