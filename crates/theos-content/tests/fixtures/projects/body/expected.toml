# Checked by hand against docs/specs/phases/P04-validation-lore-rules-ledger-formalism-mirror.md
# section 5.3 and the fixture texts. Every finding of the project: path, rule, severity, line
# and column. The equation E950, whose body holds a link and an embed, has no body finding (verbatim); its
# only finding is formalism/stray.

# formalism/stray (section 5.14, R-P4): the equation record has no _source.json to list it;
# its id value sits at line 3, column 5.
[[finding]]
path = "canon/formalism/E950.md"
rule = "formalism/stray"
severity = "error"
line = 3
column = 5

[[finding]]
path = "concepts/synthetic-board.md"
rule = "body/note-id"
severity = "error"
line = 15
column = 11

[[finding]]
path = "concepts/synthetic-board.md"
rule = "body/note-state"
severity = "error"
line = 18
column = 16

[[finding]]
path = "concepts/synthetic-board.md"
rule = "body/callout-title"
severity = "error"
line = 21
column = 11

[[finding]]
path = "lore/topics/synthetic-board-explaining.md"
