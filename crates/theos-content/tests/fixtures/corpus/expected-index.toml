# synthetic fixture list (P03), not canon. Two tables, each entry a finding with path, rule,
# severity, line and column:
# - [[project]]: every finding of `records/` plus `malformed/` indexed as one project (see
#   TempProject::corpus), each checked by hand against docs/specs/data-model.md and the file:
#   link/dangling (data model example ids, P01 placeholders such as `todo`, and ids of records
#   the corpus does not hold), schema/version-id (a version whose parent is the placeholder
#   `todo`), schema/topic-counterpart (an in-world topic without `counterpart`) and
#   schema/unknown-field (fields that a `thing` does not have, in P02's YAML fixtures). Items of
#   a malformed body are P04's findings, not listed here;
# - [[crlf]]: the findings of the CRLF files that have no twin among the records, each with the
#   name of its `input` file, indexed alone at `things/<input>`.

