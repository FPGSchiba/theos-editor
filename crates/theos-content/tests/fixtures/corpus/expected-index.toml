# synthetic fixture list (P03), not canon. Two tables, each entry a finding with path, rule,
# severity, line and column:
# - [[project]]: every finding of `records/` plus `malformed/` indexed as one project (see
#   TempProject::corpus), each checked by hand against docs/specs/data-model.md and the file:
#   link/dangling (data model example ids, P01 placeholders such as `todo`, and ids of records
#   the corpus does not hold), schema/version-id (a version whose parent is the placeholder
#   `todo`), schema/topic-counterpart (an in-world topic without `counterpart`) and
#   schema/unknown-field (fields that a `thing` does not have, in P02's YAML fixtures). The body
#   rules of P04 add the `body/` findings: the malformed constructs of `malformed/` (each case
#   of its `expected.toml`), the unknown beat keys (`synthetic::`) and the unknown note state
#   of `synthetic-concept-notes.md` (CE-15.5), and the three-clue warning of T-901, which no clue
#   reveals; and lore/inworld-vocab (section 5.11): `B-902` as a belief title and `S-004` as a
#   bare link in a voice block. The malformed voice titles of
#   `synthetic-malformed-voices-in-world.md` are cut from the in-world text like good ones: their
#   fault is the `body/callout-title` finding, so they give no inworld-vocab finding;
# - [[crlf]]: the findings of the CRLF files that have no twin among the records, each with the
#   name of its `input` file, indexed alone at `things/<input>`.

# formalism/stray (section 5.14, R-P4): the equation record has no _source.json to list it;
# its id value sits at line 3, column 5.
