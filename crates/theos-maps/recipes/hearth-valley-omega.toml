# Intent: a temperate Hearth floor. Mountains along the north rim, a gentler dome in the
# east, a slowly sinking basin that may hold a lake. Rivers leave over the south rim.
# No settlements, resources, roads or sites; the detuning stage writes the omega layer.
id      = "hearth-valley-omega"
title   = "Hearth valley with omega"
kind    = "terrain"
grid    = [384, 384]
size_km = [24.0, 24.0]
renders = ["omega"]

[[stage]]
id    = "grid"
edges = ["south"]

[[stage]]
id                   = "tectonics"
background_uplift    = 2.2e-4
background_variation = 0.9
background_beta      = 2.8
  [[stage.source]]
  type = "orogen"
  path = [[0.02, 0.14], [0.40, 0.08], [0.98, 0.20]]
  width = 0.10
  rate = 2.6e-3
  asymmetry = 0.5
  jitter = 0.06
  [[stage.source]]
  type = "dome"
  at = [0.75, 0.55]
  r = 0.12
  rate = 9.0e-4
  jitter = 0.10
  [[stage.source]]
  type = "basin"
  at = [0.33, 0.60]
  r = 0.06
  rate = 0.0
  depth_m = 18.0
  jitter = 0.08

[[stage]]
id        = "geology"
provinces = 7
plutons   = [0, 2]
  [stage.rock_mix]
  granite   = 0.15
  sandstone = 0.30
  shale     = 0.25
  limestone = 0.20
  basalt    = 0.10
  [stage.fold_belt]
  width    = 0.09
  strength = 0.45
  period   = 0.045
  contrast = 1.8

[[stage]]
id              = "climate_model"
wind_from_deg   = 250.0
wind_speed      = 10.0
base_precip_mm  = 520.0
orographic_mm   = 1300.0
t_base_c        = 12.0
lapse_c_per_km  = 6.5

[[stage]]
id     = "landscape_evolution"
steps  = 240
dt_yr  = 2.5e4
  [[stage.process]]
  id = "uplift"
  [[stage.process]]
  id = "hillslope"
  [[stage.process]]
  id = "route_steepest"
  [[stage.process]]
  id = "resolve_sinks"
  [[stage.process]]
  id = "partition_flow"
  exponent = "slope_adaptive"
  [[stage.process]]
  id = "fluvial"
  m = 0.45
  g = 1.0
  [[stage.process]]
  id = "slope_limit"
  [[stage.process]]
  id = "climate_update"
  every = 30

[[stage]]
id          = "hydrology"
river_q     = 0.15
big_river_q = 2.0

[[stage]]
id = "ecology"

[[stage]]
id = "elements"

[[stage]]
id                           = "pois"
ruins                        = 2
chimes                       = 2
gates                        = 0
min_chime_sep_km             = 8.0
chime_min_km_from_settlement = 3.0

[[stage]]
id = "travel"

[[stage]]
id            = "detuning"
baseline      = 0.12
ruin_radius_km = 2.5

[constraints]
"elevation_m.relief"              = [800, 2200]
vegetation_cover_pct              = [25, 75]
"travel.chime_to_chime_min"       = [60, 240]
"features.ruin"                   = [2, 2]
"features.chime"                  = [2, 2]
