# Intent: 0.3.0's choir-hall complex. Entered from the south rim; the round choir hall is the
# goal. One arc reaches the hall through a lock, the other holds its key and is joined to the
# hall only by a drop out of it. The echo vault lies behind its own lock. Leaves and exits hang
# off the start, the arcs and the hall, never off other leaves, which keeps the chokepoints
# within 0.3.0's range. Room types are ids, not canon.
id      = "choir-hall-ruin"
title   = "Choir hall ruin"
kind    = "interior"
grid    = [100, 100]
size_km = [0.1, 0.1]

[[stage]]
id       = "envelope"
shape    = "circle"
margin_m = 1.0
pitch_m  = 10.0
jitter_m = 2.0

[[stage]]
id = "mission"
  [[stage.room]]
  type = "entrance"
  role = "start"
  [[stage.room]]
  type      = "choir-hall"
  role      = "goal"
  footprint = [2, 2]
  shape     = "round"
  [[stage.room]]
  type      = "tuning-gallery"
  role      = "path"
  count     = [2, 3]
  footprint = [1, 2]
  shape     = "passage"
  [[stage.room]]
  type  = "junction"
  role  = "path"
  count = [1, 2]
  [[stage.room]]
  type = "operator-room"
  role = "path"
  [[stage.room]]
  type   = "echo-vault"
  role   = "leaf"
  shape  = "round"
  locked = true
  [[stage.room]]
  type  = "collapsed"
  role  = "leaf"
  count = [1, 2]
  shape = "ragged"
  [[stage.room]]
  type = "shrine-crypt"
  role = "leaf"
  [[stage.room]]
  type  = "store"
  role  = "leaf"
  count = [1, 2]
  [[stage.room]]
  type  = "exit"
  role  = "exit"
  count = 2
  shape = "round"
  [[stage.rule]]
  rule    = "main_cycle"
  side    = "south"
  cycle   = "lock_key"
  min_arc = 2
  [[stage.rule]]
  rule  = "merge_hall"
  count = 2
  [[stage.rule]]
  rule = "insert_cycle"
  [[stage.rule]]
  rule = "locked_leaf"
  [[stage.rule]]
  rule       = "leaf"
  count      = [3, 5]
  from_roles = ["start", "path", "goal"]
  [[stage.rule]]
  rule       = "leaf"
  role       = "exit"
  count      = 2
  from_roles = ["start", "path", "goal"]

[[stage]]
id = "space"

[[stage]]
id              = "cover"
max_sightline_m = 40.0

[[stage]]
id = "playability"

[constraints]
"stages.mission.short"                   = [0, 0]
"stages.playability.rooms"               = [13, 22]
"stages.playability.critical_path_m"     = [90, 220]   # ruling 11: the dense floor, not 0.3.0's [90, 260]
"stages.playability.dead_end_pct"        = [25, 55]
"stages.playability.cycles"              = [2, 3]
"stages.playability.longest_sightline_m" = [10, 45]    # 0.3.0's
"stages.playability.chokepoints"         = [1, 6]      # 0.3.0's
