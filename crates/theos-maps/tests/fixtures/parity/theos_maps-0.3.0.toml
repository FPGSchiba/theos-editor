# 0.3.0 reference for CE-28.5 — copied from the P08 spec, Appendix A
# (docs/specs/phases/P08-map-format-and-terrain-generator.md). The spec is the source: change it
# there first. Every row of the appendix is here.
#
# Fields per seed, with the appendix's column:
# - relief_m              "Relief (m)", summary path `elevation_m.relief`
# - lake_pct              "Lake share (%)", `lake_pct`
# - rivers_pct            "River share (%)", `rivers_pct`
# - vegetation_cover_pct  "Vegetation cover (%)", `vegetation_cover_pct`
# - precip_median_mm      "Median precipitation (mm/yr)", `precip_mm_yr.median`
# - lakes                 "Lakes", the number of lakes
# - chime_to_chime_min    "Extraction walk (min)": 0.3.0's `travel.extraction_to_extraction_min`,
#                         which P08 reports as `travel.chime_to_chime_min`
# - passes                "All constraints": true or false, or "no constraints" for a recipe
#                         that has none; 0.3.0's ruin and extraction placement checks included
# - failed                the constraints a failing seed missed, as the appendix names them

[provenance]
toolset = "theos_maps 0.3.0"
python = "3.12"
fastscapelib = "0.3.0"
numpy = "2.5.4"
scipy = "1.18.1"
command = "uv run --no-project --python 3.12 --with fastscapelib==0.3.0 … (do_export=False)"
date = "2026-11-10"
reference = "Jann's export, in no repository"

