<!-- @dsCard group="Chrome" height=345 width=1440 subtitle="minimize, maximize or restore, close" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>WindowControls — preview</title>
<style>
  html, body { margin: 0; }
  .pv { display: grid; grid-template-columns: minmax(0, 1fr); }
  .pv__col { background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pv__name { font: 700 10.5px/14px var(--font-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--textDim); }
  .pv__note { font: 400 10px/14px var(--font-mono); color: var(--textDim); }
  .pv__bar { border: 1px solid var(--borderHi); position: relative; }
  .pv__room { height: 190px; position: relative; }
</style></head>
<body>
<div class="pv">
<div class="pv__col" data-theme="grid-noir"><div class="pv__name">Grid Noir</div>
<div class="pv__note">Restored: 46 x 26, below the 4px resize strip</div>
<div class="pv__bar" style="display:flex;justify-content:flex-end">
<header class="tu-titlebar tu-titlebar--frameless" style="padding:0;flex:none"><div class="tu-winctl" role="group" aria-label="Window"><button class="tu-winctl__btn" type="button" aria-label="Minimise">−</button><button class="tu-winctl__btn" type="button" aria-label="Maximise">□</button><button class="tu-winctl__btn is-close" type="button" aria-label="Close">✕</button></div></header></div>
<div class="pv__note">Maximized: 46 x 30, restore glyph ▫</div>
<div class="pv__bar" style="display:flex;justify-content:flex-end">
<header class="tu-titlebar tu-titlebar--frameless is-maximized" style="padding:0;flex:none"><div class="tu-winctl" role="group" aria-label="Window"><button class="tu-winctl__btn" type="button" aria-label="Minimise">−</button><button class="tu-winctl__btn" type="button" aria-label="Restore">▫</button><button class="tu-winctl__btn is-close" type="button" aria-label="Close">✕</button></div></header></div></div>
<div class="pv__col" data-theme="grid-light"><div class="pv__name">Grid Light</div>
<div class="pv__note">Restored: 46 x 26, below the 4px resize strip</div>
<div class="pv__bar" style="display:flex;justify-content:flex-end">
<header class="tu-titlebar tu-titlebar--frameless" style="padding:0;flex:none"><div class="tu-winctl" role="group" aria-label="Window"><button class="tu-winctl__btn" type="button" aria-label="Minimise">−</button><button class="tu-winctl__btn" type="button" aria-label="Maximise">□</button><button class="tu-winctl__btn is-close" type="button" aria-label="Close">✕</button></div></header></div>
<div class="pv__note">Maximized: 46 x 30, restore glyph ▫</div>
<div class="pv__bar" style="display:flex;justify-content:flex-end">
<header class="tu-titlebar tu-titlebar--frameless is-maximized" style="padding:0;flex:none"><div class="tu-winctl" role="group" aria-label="Window"><button class="tu-winctl__btn" type="button" aria-label="Minimise">−</button><button class="tu-winctl__btn" type="button" aria-label="Restore">▫</button><button class="tu-winctl__btn is-close" type="button" aria-label="Close">✕</button></div></header></div></div></div>
</body>
</html>
