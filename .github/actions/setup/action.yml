name: Set up the gate
description: >-
  Installs the Rust toolchain of rust-toolchain.toml, restores the build cache and installs the
  tools at the versions of gate/tools.toml. Jobs that build or test run it after the checkout; jobs
  that only run xtask get it through .github/actions/xtask, which runs it on a cache miss.

# Without inputs a job gets rust-cache's own behaviour: a cache of its own, saved by every run.
inputs:
  cache-key:
    description: >-
      The cache key of jobs that build the same thing and share one build cache. Empty: the job
      id.
    required: false
    default: ''
  save-cache:
    description: >-
      Whether the job saves the build cache: `true` or `false`. A job that only restores passes
      `false`.
    required: false
    default: 'true'
  save-xtask:
    description: >-
      Whether the job saves the xtask binary that the tools step built, for the jobs that only
      need xtask: `true` or `false`. Only the gate job on `main` passes `true`.
    required: false
    default: 'false'
  gui-packages:
    description: >-
      The checks of the job that build the Tauri crates, comma separated, or `false`. When the run
      needs any of them (`cargo xtask needs`, the scope of `gate`), the action installs the Linux
      packages of gate/linux-packages.txt that they need. The downloaded `.deb` files are cached
      by the runner image and the list.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # `rustup toolchain install` without arguments reads rust-toolchain.toml. Since rustup 1.28
    # `rustup show` no longer installs anything.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    - name: Restore the build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}

    # The line is `name@version,...` for every tool of gate/tools.toml. It goes to the next step
    # as a step output.
    - name: Read the pinned tools
      id: tools
      shell: bash
      run: |
        spec="$(cargo xtask tools --print-install-spec)"
        echo "spec=${spec}" >> "$GITHUB_OUTPUT"

    - name: Install the pinned tools
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      with:
        tool: ${{ steps.tools.outputs.spec }}

    # The tools step built xtask into this path through the alias of `.cargo/config.toml`. The key
    # names everything that goes into the binary.
    - name: Save the xtask binary
      if: inputs.save-xtask == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/xtask-bin/debug/xtask
        key: xtask-bin-${{ runner.os }}-${{ hashFiles('xtask/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**') }}

    # The Linux packages of the GUI, from the list of gate/linux-packages.txt, only when the run
    # needs the checks that build them and Cargo.lock names webkit2gtk, the package that links
    # them: a pull request that changes no code installs nothing.
    # xtask is built by now. It writes `needed=true` or `needed=false` to the step outputs.
    - name: Ask whether the run needs the packages
      id: needs
      if: inputs.gui-packages != 'false'
      shell: bash
      env:
        NEEDS: ${{ inputs.gui-packages }}
      run: cargo xtask needs --requires-package webkit2gtk "$NEEDS"

    # The downloaded `.deb` files are cached; the image goes into the key because a new runner
    # image has other versions of the packages.
    - name: Read the runner image
      id: image
      if: inputs.gui-packages != 'false' && steps.needs.outputs.needed == 'true'
      shell: bash
      run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

    # The folder belongs to root, and the cache action restores as the runner user.
    - name: Open the package folder
      if: inputs.gui-packages != 'false' && steps.needs.outputs.needed == 'true'
      shell: bash
      run: sudo chown "$(id -u)" /var/cache/apt/archives

    - name: Restore the Linux packages
      id: packages
      if: inputs.gui-packages != 'false' && steps.needs.outputs.needed == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/apt/archives/*.deb
        key: linux-packages-${{ runner.os }}-${{ steps.image.outputs.image }}-${{ hashFiles('gate/linux-packages.txt') }}

    - name: Install the Linux packages
      if: inputs.gui-packages != 'false' && steps.needs.outputs.needed == 'true'
      shell: bash
      run: |
        sudo apt-get update
        xargs -a gate/linux-packages.txt sudo apt-get install --no-install-recommends --yes

    # Only a job that saves its caches saves this one, and only after a miss.
    - name: Save the Linux packages
      if: inputs.gui-packages != 'false' && steps.needs.outputs.needed == 'true' && inputs.save-cache == 'true' && steps.packages.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/apt/archives/*.deb
        key: linux-packages-${{ runner.os }}-${{ steps.image.outputs.image }}-${{ hashFiles('gate/linux-packages.txt') }}
