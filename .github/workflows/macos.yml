# macOS is not in the per-pull-request matrix (docs/gate.md section 1): its runner minutes are
# expensive. This runs clippy and the tests there every Monday and on demand, and on a pull
# request that Jann labels `macos`. The jobs are not required status checks.
name: macos

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  clippy-macos:
    name: clippy (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: cargo xtask clippy

  test-macos:
    name: test (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: cargo xtask test
