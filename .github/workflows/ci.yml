# Three jobs side by side, so the run takes as long as the slowest one: `gate` runs the cheap
# checks of docs/gate.md section 1, `test` and `coverage` the two long ones. Each job checks out,
# sets up and runs `cargo xtask gate` with the checks it owns; xtask decides every verdict. The
# job name is the required status check of `main` (gate/ruleset-main.json), and `cargo xtask gate`
# runs all of the checks locally.
# Per-pull-request checks run on Linux only (D8); Windows and macOS are in platforms.yml.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The push to main fills the caches the next pull requests restore, among them the coverage
  # baseline and the built xtask.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads history: every job reads the changed paths since the merge base to decide
# whether the change needs its checks, `commit-msg` also the commits of the pull request, and
# `slow-tests` and `coverage` the merge base. A pull request saves no build cache and no xtask: it is searched
# first, so one it saved would win over the cache of `main`. Only the coverage baseline, keyed by
# the base commit, is saved by whichever run measured it.
jobs:
  # `gate` also saves the xtask binary on `main`, which the jobs that only need xtask restore
  # instead of building it.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: gate
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          save-xtask: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask gate --skip test,coverage

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask gate --only test

  # The baseline of `main` is measured at the merge base and is cached by commit: a pull request
  # finds the result its base commit stored when it was pushed to main.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: coverage
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/xtask/coverage/cache
          key: coverage-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('rust-toolchain.toml', 'gate/tools.toml') }}
          restore-keys: coverage-
      - run: cargo xtask gate --only coverage
