# The approval of a pull request that touches a protected path (docs/gate.md section 5).
#
# D3: the job runs the gate of `main`, not the one the pull request brings. It checks out the base
# commit of the pull request (with its history, so the head commits are there as git objects) and
# runs that commit's xtask against the pull request's changes. Only while the base commit has no
# xtask (the pull request that adds the gate) does the job check out the head and run its own.
#
# The token labels and comments on the pull request, which is why this is the one job with write
# scopes. Label and comment changes made with it start no new workflow run.
name: approval

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A run is never cancelled, so that a label change is not cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approval:
    name: approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The credentials stay in the checkout: `xtask approval` fetches the refs of the pull
      # request with `git fetch origin`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('xtask/Cargo.toml') == ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # After both checkouts: the key of the cached xtask hashes the checkout this job runs, the
      # base commit (the head only while the base has no xtask).
      - uses: ./.github/actions/xtask
        if: hashFiles('.github/actions/xtask/action.yml') != ''
      # Bases older than P50 have no cached-xtask action. Their setup action builds xtask into the
      # same path (its tools step runs the `cargo xtask` alias) and, with these inputs, saves no
      # cache.
      - uses: ./.github/actions/setup
        if: hashFiles('.github/actions/xtask/action.yml') == ''
        with:
          cache-key: gate
          save-cache: 'false'
      - run: target/xtask-bin/debug/xtask --root . approval
        env:
          GH_TOKEN: ${{ github.token }}
