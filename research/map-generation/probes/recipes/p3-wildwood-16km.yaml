# Probe 3 (band 3): dense forest, strong relief, wet basins ("swamp"), few roads.
# Same structure as p1b-farmland-16km.yaml (probe 8 interpolates between the two).
# 0.3.0 has no swamp/wetland layer: wet flats exist only as the resource field `peat_reeds`
# and as lakes. Giant trees (type I) are not expressible at all (vegetation is a density).
name: p3-wildwood-16km
kind: terrain
grid: [384, 384]
size_km: [16, 16]
renders: [truth]
pipeline:
  - stage: grid
    edges: [south]
  - stage: tectonics
    background_uplift: 1.8e-4
    background_variation: 0.5
    background_beta: 3.0
    sources:
      - {type: orogen, path: [[0.20, 0.02], [0.30, 0.50], [0.15, 0.98]], width: 0.12, rate: 1.3e-3, asymmetry: 0.5, jitter: 0.04}
      - {type: dome, at: [0.60, 0.75], r: 0.14, rate: 7.0e-4, jitter: 0.06}
      - {type: dome, at: [0.55, 0.20], r: 0.12, rate: 6.0e-4, jitter: 0.06}
      - {type: basin, at: [0.75, 0.45], r: 0.07, rate: 0, depth_m: 12, jitter: 0.05}
      - {type: basin, at: [0.45, 0.50], r: 0.05, rate: 0, depth_m: 10, jitter: 0.05}
  - stage: geology
    provinces: 8
    rock_mix: {granite: 0.30, sandstone: 0.20, shale: 0.20, limestone: 0.30}
    fold_belt: {width: 0.10, strength: 0.6, period: 0.035, contrast: 2.5}
    plutons: [1, 2]
  - stage: climate_model
    wind_from_deg: 250
    wind_speed: 10
    base_precip_mm: 1500
    orographic_mm: 1600
    T_base_c: 16
    lapse_c_per_km: 5.0
  - stage: landscape_evolution
    steps: 240
    dt_yr: 2.5e4
    climate_every: 30
  - stage: hydrology
    river_q: 0.15
    big_river_q: 2.0
  - stage: ecology
  - stage: elements
  - stage: settlements
    counts: {town: 0, village: 1, hamlet: 3}
    spacing_km: {town: 4.5, village: 3.0, hamlet: 2.5}
  - stage: pois
    ruins: 3
    extractions: 2
    portals: 2
    min_extraction_sep_km: 6
    extraction_min_km_from_settlement: 2.0
  - stage: resources
    counts: {stone: 1, clay: 1, timber: 6, peat_reeds: 4, herbs: 4}
  - stage: roads
    forest_cost: 3.0
    loop_detour: 9.0
  - stage: sites
    counts: {watchtower: 0, cave: 3, camp: 5}
  - stage: travel
  - stage: constraints
    elevation_m.relief: [900, 2600]
    lake_pct: [2, 15]
    vegetation_cover_pct: [70, 100]
    feature_counts.peat_reeds: [3, 4]
