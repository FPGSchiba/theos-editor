  spacing_km: {town: 4.5, village: 3.0, hamlet: 2.5}
- {stage: pois, ruins: 3, extractions: 2, portals: 2, min_extraction_sep_km: 6, extraction_min_km_from_settlement: 2.0}
- stage: resources
  counts: {stone: 1, clay: 1, timber: 6, peat_reeds: 4, herbs: 4}
- {stage: roads, forest_cost: 3.0, loop_detour: 9.0}
- stage: sites
