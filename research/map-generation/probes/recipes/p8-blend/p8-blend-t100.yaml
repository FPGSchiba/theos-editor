    path:
    - [0.2, 0.02]
    - [0.3, 0.5]
    - [0.15, 0.98]
    width: 0.12
    rate: 0.0013
    asymmetry: 0.5
    jitter: 0.04
  - type: dome
    at: [0.6, 0.75]
    r: 0.14
    rate: 0.0007
    jitter: 0.06
  - type: dome
    at: [0.55, 0.2]
    r: 0.12
    rate: 0.0006
    jitter: 0.06
  - type: basin
    at: [0.75, 0.45]
    r: 0.07
    rate: 0
    depth_m: 12
    jitter: 0.05
  - type: basin
    at: [0.45, 0.5]
    r: 0.05
    rate: 0
    depth_m: 10
    jitter: 0.05
- stage: geology
