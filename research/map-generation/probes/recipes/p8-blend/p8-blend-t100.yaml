- {stage: climate_model, wind_from_deg: 250, wind_speed: 10, base_precip_mm: 1500,
  orographic_mm: 1600, T_base_c: 16, lapse_c_per_km: 5.0}
- {stage: landscape_evolution, steps: 240, dt_yr: 25000.0, climate_every: 30}
- {stage: hydrology, river_q: 0.15, big_river_q: 2.0}
- {stage: ecology}
- {stage: elements}
- stage: settlements
