# Probe 5, failed variant (n = 2 flattens everything; kept as evidence): the steepest hard-rock relief the model can make. Only granite and
# quartzite (lowest K and Kd), many small fast volcano/dome sources as "needles", slope
# exponent n = 2 (steeper channels for the same uplift), dry-ish climate, all edges drained
# so the peaks stand above a low "cloud sea" datum. 8 km at 384 cells = 20.8 m cells.
name: p5x-needle-peaks-n2-8km
kind: terrain
grid: [384, 384]
size_km: [8, 8]
renders: [truth]
pipeline:
  - stage: grid
    edges: [north, south, east, west]
  - stage: tectonics
    background_uplift: 0.5e-4
    background_variation: 0.9
    background_beta: 2.2
    warp: 0.02
    sources:
      - {type: dome, at: [0.20, 0.22], r: 0.035, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.25, 0.55], r: 0.030, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.22, 0.82], r: 0.035, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.45, 0.35], r: 0.030, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.50, 0.68], r: 0.035, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.62, 0.15], r: 0.030, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.72, 0.48], r: 0.035, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.78, 0.80], r: 0.030, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.40, 0.90], r: 0.025, rate: 9.0e-3, jitter: 0.03}
      - {type: dome, at: [0.85, 0.25], r: 0.025, rate: 9.0e-3, jitter: 0.03}
  - stage: geology
    provinces: 5
    rock_mix: {granite: 0.6, quartzite: 0.4}
    plutons: [0, 0]
  - stage: climate_model
    wind_from_deg: 250
    base_precip_mm: 700
    orographic_mm: 600
    T_base_c: 14
  - stage: landscape_evolution
    steps: 240
    dt_yr: 2.5e4
    n: 2.0
    m: 0.9
    climate_every: 30
  - stage: hydrology
    river_q: 0.05
    big_river_q: 1.0
  - stage: ecology
  - stage: elements
  - stage: settlements
    counts: {village: 1, hamlet: 3}
    spacing_km: {village: 2.0, hamlet: 1.2}
  - stage: pois
    ruins: 2
    extractions: 2
    portals: 0
    min_extraction_sep_km: 3
    extraction_min_km_from_settlement: 1.0
  - stage: roads
  - stage: travel
  - stage: constraints
    elevation_m.relief: [1200, 6000]
