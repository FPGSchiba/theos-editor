# Nextest profiles for the gate. `.config/nextest.toml` is a byte copy of this file, which is
# where nextest looks; `cargo xtask lints` keeps the two identical.
# Reports are written to `target/nextest/<profile>/junit.xml`.

[profile.default]
retries = 0
fail-fast = false
junit.path = "junit.xml"

[profile.ci]
retries = 0
fail-fast = false
junit.path = "junit.xml"
